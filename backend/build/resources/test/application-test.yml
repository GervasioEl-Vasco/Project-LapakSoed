spring:
  datasource:
    url: jdbc:h2:mem:lapaksoed-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  jwt:
    secret: test-secret-that-is-long-enough-for-hmac-sha-256
    expiration-minutes: 60
  cors:
    allowed-origins: http://localhost:3000