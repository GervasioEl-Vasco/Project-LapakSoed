server:
  port: ${PORT:8080}

spring:
  application:
    name: lapaksoed-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lapaksoed}
    username: ${DATABASE_USER:lapaksoed}
    password: ${DATABASE_PASSWORD:lapaksoed}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  jwt:
    # Ganti dengan secret acak minimal 32 karakter sebelum deployment.
    secret: ${JWT_SECRET:local-development-secret-change-before-deploy-123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  promotions:
    admin-key: ${PROMOTION_ADMIN_KEY:}
  demo-data:
    enabled: ${SEED_DEMO_DATA:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info